<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>クイズアプリ</title>
    <style>
        /* --- 画像の色味に合わせたカラーパレット --- */
        :root {
            --color-bg: #f7f8f6;           /* 全体の背景色（明るく清潔感のある色） */
            --color-card: #ffffff;         /* カードの背景 */
            --color-blue: #b0c4de;         /* 左側の花びら色（ブルーグレー） */
            --color-green: #a3b899;        /* 右側の花びら色（くすみグリーン） */
            --color-brown: #a89f91;        /* 上部のアクセント色（グレージュ） */
            --color-text: #5a5a5a;         /* 優しい印象の文字色 */
            --color-text-sub: #8c8c8c;     /* サブテキスト色 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background-color: var(--color-card);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(168, 159, 145, 0.15); /* グレージュ系の柔らかい影 */
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--color-brown);
            margin-top: 0;
            font-size: 1.4rem;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--color-text-sub);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--color-bg);
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #fafbfc;
            border: 2px solid #e1e4e8;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--color-text);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: var(--color-blue);
            border-color: var(--color-blue);
            color: #ffffff;
        }

        /* 結果画面のスタイル */
        .result-screen {
            text-align: center;
        }

        .result-screen p {
            font-size: 1.1rem;
            margin: 15px 0;
        }

        .restart-btn {
            background-color: var(--color-green);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .restart-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h2>クイズ</h2>
        
        <!-- クイズ進行中画面 -->
        <div id="quiz-screen">
            <div class="quiz-info">
                <span id="question-count">問題 1 / 3</span>
                <span id="timer">タイム: 0.0秒</span>
            </div>
            <div class="question-text" id="question-text">ここに問題文が入ります</div>
            <div class="options-list" id="options-list">
                <!-- 選択肢がここに動的に入ります -->
            </div>
        </div>

        <!-- 結果表示画面 -->
        <div id="result-screen" class="result-screen" style="display: none;">
            <h2>お疲れ様でした！</h2>
            <p id="final-score">正解数: 3 / 3</p>
            <p id="final-time">かかった時間: 0.0秒</p>
            <button class="restart-btn" onclick="startQuiz()">もう一度挑戦する</button>
        </div>
    </div>

    <script>
        // サンプル問題データ（必要に応じて自由に変更・追加してください）
        const originalQuestions = [
            {
                question: "画像のデザインのモチーフになっている植物は何でしょう？",
                options: ["チューリップ", "バラ", "ひまわり", "クローバー"],
                answer: 0
            },
            {
                question: "日本で一番高い山はどれでしょう？",
                options: ["高尾山", "富士山", "北岳", "穂高岳"],
                answer: 1
            },
            {
                question: "次のうち、果物に含まれるものはどれでしょう？",
                options: ["トマト", "キャベツ", "ニンジン", "ホウレンソウ"],
                answer: 0
            }
        ];

        let questions = [];
        let currentIdx = 0;
        let score = 0;
        let startTime = 0;
        let timerInterval = null;

        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionCountElem = document.getElementById("question-count");
        const timerElem = document.getElementById("timer");
        const questionTextElem = document.getElementById("question-text");
        const optionsListElem = document.getElementById("options-list");
        const finalScoreElem = document.getElementById("final-score");
        const finalTimeElem = document.getElementById("final-time");

        // 配列をランダムに並び替える関数（Fisher-Yatesアルゴリズム）
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            // 問題をランダムにシャッフルしてセット
            questions = shuffle(originalQuestions);
            currentIdx = 0;
            score = 0;

            quizScreen.style.display = "block";
            resultScreen.style.display = "none";

            // タイマー開始
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);

            showQuestion();
        }

        function updateTimer() {
            const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
            timerElem.textContent = `タイム: ${elapsedTime}秒`;
        }

        function showQuestion() {
            const q = questions[currentIdx];
            questionCountElem.textContent = `問題 ${currentIdx + 1} / ${questions.length}`;
            questionTextElem.textContent = q.question;

            optionsListElem.innerHTML = "";
            
            // 選択肢もランダムにしたい場合は下の行のコメントアウトを外してください（今はそのまま）
            // const shuffledOptions = shuffle(q.options); 

            q.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = option;
                btn.onclick = () => selectAnswer(index === q.answer);
                optionsListElem.appendChild(btn);
            });
        }

        function selectAnswer(isCorrect) {
            if (isCorrect) {
                score++;
            }

            currentIdx++;
            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);

            quizScreen.style.display = "none";
            resultScreen.style.display = "block";

            finalScoreElem.textContent = `正解数: ${score} / ${questions.length}`;
            finalTimeElem.textContent = `かかった時間: ${totalTime}秒`;
        }

        // 初期化してスタート
        startQuiz();
    </script>

</body>
</html>
