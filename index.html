<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloom Wammy けいさんカード</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff9e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 全体のやさしいデザイン */
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: #fff9e6;
      color: #5d4037;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    
    h1 {
      font-size: 1.5rem;
      color: #8d6e63;
      margin-bottom: 15px;
    }

    /* 各画面の切り替え用 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* モード選択（たしざん・ひきざん） */
    .mode-selector {
      margin-bottom: 20px;
    }
    .mode-selector select {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #a1887f;
      background-color: white;
      color: #5d4037;
      outline: none;
    }

    /* 記録表示エリア */
    .record-box {
      background: white;
      border-radius: 15px;
      padding: 15px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(141, 110, 99, 0.1);
      font-size: 1.1rem;
    }
    .record-box div {
      margin: 5px 0;
    }
    .best-time { color: #e91e63; font-weight: bold; }
    .last-time { color: #2196f3; }

    /* プレイ画面の上のバー（戻るボタンと進行度） */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 85%;
      max-width: 320px;
      margin-bottom: 10px;
    }
    .back-btn {
      background: white;
      border: 2px solid #a1887f;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
      color: #5d4037;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .progress {
      font-size: 1.3rem;
      font-weight: bold;
      color: #8d6e63;
      background: white;
      padding: 5px 15px;
      border-radius: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* カード全体 */
    .card-container {
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(141, 110, 99, 0.15);
      width: 85%;
      max-width: 320px;
      overflow: hidden;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
    }

    .question-box {
      background-color: #ffffff;
      padding: 35px 20px 20px 20px;
      border-bottom: 2px dashed #f0e6d2;
    }
    .question {
      font-size: 4.5rem;
      font-weight: bold;
      letter-spacing: 5px;
    }

    .answer-box {
      background-color: #fff5e6;
      padding: 20px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .answer {
      font-size: 4rem;
      color: #ff7043;
      font-weight: bold;
      visibility: hidden;
    }
    .answer.show {
      visibility: visible;
    }

    /* ボタンエリア */
    button {
      font-size: 1.3rem;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      touch-action: manipulation;
      transition: all 0.2s ease;
    }
    .btn-start { background-color: #4caf50; color: white; font-size: 1.5rem; width: 85%; max-width: 320px; }
    .btn-answer { background-color: #ffb74d; color: white; }
    .btn-next { background-color: #81c784; color: white; }
    
    /* 結果画面 */
    .result-title { font-size: 2rem; color: #ff9800; margin-bottom: 20px; }
    .result-time { font-size: 2.5rem; color: #e91e63; font-weight: bold; margin-bottom: 30px; }
    .new-record { color: #ffeb3b; background: #e91e63; padding: 5px 15px; border-radius: 20px; font-size: 1.2rem; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

  <!-- 画面1：スタート画面 -->
  <div id="start-screen" class="screen active">
    <h1>🌱 Bloom Wammy けいさんカード</h1>
    
    <div class="mode-selector">
      <select id="mode" onchange="updateRecordsDisplay()">
        <option value="add">たしざん</option>
        <option value="sub">ひきざん</option>
      </select>
    </div>

    <div class="record-box">
      <div class="best-time">👑 ベストタイム: <span id="best-time-display">--:--</span></div>
      <div class="last-time">🕒 ぜんかい: <span id="last-time-display">--:--</span></div>
    </div>

    <button class="btn-start" onclick="startGame()">よーい、スタート！</button>
  </div>

  <!-- 画面2：プレイ画面 -->
  <div id="play-screen" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goToStart()">↩️</button>
      <div class="progress"><span id="current-q">1</span> / 10</div>
    </div>

    <div class="card-container">
      <div class="question-box">
        <div class="question" id="question">1 + 1</div>
      </div>
      <div class="answer-box">
        <div class="answer" id="answer">2</div>
      </div>
    </div>

    <button id="actionBtn" class="btn-answer" onclick="handleButtonClick()">こたえをみる</button>
  </div>

  <!-- 画面3：結果発表画面 -->
  <div id="result-screen" class="screen">
    <div class="result-title">🎉 よくがんばったね！ 🎉</div>
    <div id="new-record-badge" class="new-record">✨ 新記録達成！ ✨</div>
    <div class="result-time" id="final-time">00:00</div>
    <button class="btn-start" onclick="goToStart()">さいしょにもどる</button>
  </div>

  <script>
    // PWA用のサービスワーカー
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }

    const TOTAL_QUESTIONS = 10;
    let currentQuestionNum = 1;
    let currentAnswer = 0;
    let isAnswerShown = false;
    let startTime;

    // 画面を切り替える機能
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // 記録の表示を更新する機能
    function updateRecordsDisplay() {
      const mode = document.getElementById('mode').value;
      const best = localStorage.getItem(`bestTime_${mode}`);
      const last = localStorage.getItem(`lastTime_${mode}`);
      
      document.getElementById('best-time-display').innerText = best ? formatTime(best) : '--:--';
      document.getElementById('last-time-display').innerText = last ? formatTime(last) : '--:--';
    }

    // ミリ秒を「00:00」の形にする機能
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // スタート画面に戻る
    function goToStart() {
      updateRecordsDisplay();
      showScreen('start-screen');
    }

    // ゲームスタート！
    function startGame() {
      currentQuestionNum = 1;
      startTime = Date.now(); // 時間を測り始める
      generateQuestion();
      showScreen('play-screen');
    }

    // 問題を作る機能
    function generateQuestion() {
      const mode = document.getElementById('mode').value;
      let num1, num2;

      if (mode === 'add') {
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        currentAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2}`;
      } else {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * num1) + 1;
        currentAnswer = num1 - num2;
        document.getElementById('question').innerText = `${num1} - ${num2}`;
      }

      document.getElementById('current-q').innerText = currentQuestionNum;
      
      const answerElement = document.getElementById('answer');
      answerElement.innerText = currentAnswer;
      answerElement.classList.remove('show');

      const btn = document.getElementById('actionBtn');
      btn.innerText = 'こたえをみる';
      btn.className = 'btn-answer';
      isAnswerShown = false;
    }

    // ボタンが押されたときの処理
    function handleButtonClick() {
      const answerElement = document.getElementById('answer');
      const btn = document.getElementById('actionBtn');

      if (!isAnswerShown) {
        // 答えを表示
        answerElement.classList.add('show');
        btn.innerText = 'つぎへ ＞';
        btn.className = 'btn-next';
        isAnswerShown = true;
      } else {
        // 次へ進むか、クリアか判定
        if (currentQuestionNum < TOTAL_QUESTIONS) {
          currentQuestionNum++;
          generateQuestion();
        } else {
          finishGame();
        }
      }
    }

    // 10問終わったときの処理
    function finishGame() {
      const endTime = Date.now();
      const timeTaken = endTime - startTime; // かかった時間
      const mode = document.getElementById('mode').value;
      
      document.getElementById('final-time').innerText = formatTime(timeTaken);
      
      // 記録の保存と新記録チェック
      const best = localStorage.getItem(`bestTime_${mode}`);
      const badge = document.getElementById('new-record-badge');
      
      localStorage.setItem(`lastTime_${mode}`, timeTaken);
      
      if (!best || timeTaken < best) {
        localStorage.setItem(`bestTime_${mode}`, timeTaken);
        badge.style.display = 'inline-block'; // 新記録バッジを表示
      } else {
        badge.style.display = 'none';
      }

      showScreen('result-screen');
    }

    // 最初にページを開いたときに記録を表示
    window.onload = updateRecordsDisplay;
  </script>
</body>
</html>
