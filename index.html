<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>けいさんカード</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 全体のデザイン（CUD配色を維持） */
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: #f7f7f7;
      color: #222222;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    h1 {
      font-size: 1.8rem;
      color: #222222;
      margin-bottom: 15px;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .screen.active {
      display: flex;
    }

    .mode-selector { margin-bottom: 20px; }
    .mode-selector select {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #555555;
      background-color: white;
      color: #222222;
      outline: none;
      font-weight: bold;
    }

    .record-box {
      background: white;
      border-radius: 15px;
      padding: 15px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 20px;
      border: 2px solid #dddddd;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .record-box div { margin: 5px 0; }
    .best-time { color: #D55E00; } 
    .last-time { color: #0072B2; }

    /* 上部バー（おうちマークへ変更） */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 85%;
      max-width: 320px;
      margin-bottom: 15px;
    }
    .back-btn {
      background: white;
      border: 2px solid #555555;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
      color: #222222;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .progress {
      font-size: 1.3rem;
      font-weight: bold;
      color: #222222;
      background: white;
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid #dddddd;
    }

    /* 計算カード本体 */
    .flashcard {
      position: relative;
      background-color: #ffffff;
      border: 2px solid #cccccc;
      border-radius: 15px;
      width: 85%;
      max-width: 320px;
      height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .card-hole {
      position: absolute; top: 15px; left: 15px; width: 20px; height: 20px;
      background-color: #f7f7f7; border-radius: 50%; border: 1px solid #cccccc;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1); z-index: 1;
    }
    .card-ring {
      position: absolute; top: -15px; left: 17px; width: 16px; height: 40px;
      border: 4px solid #aaaaaa; border-radius: 15px; z-index: 2;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .question {
      font-size: 4rem; font-weight: bold; letter-spacing: 5px;
      color: #222222; z-index: 3;
    }
    .maru-mark {
      position: absolute; font-size: 9rem; color: #D55E00; opacity: 0;
      pointer-events: none; transition: opacity 0.2s ease-in-out; z-index: 4;
    }
    .maru-mark.show { opacity: 0.6; }

    /* 10個の選択肢（2行×5列でスッキリ配置） */
    .choices-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 90%;
      max-width: 340px;
      margin-bottom: 15px;
    }
    .choice-btn {
      background-color: #0072B2;
      color: white;
      font-size: 1.6rem;
      font-weight: bold;
      height: 55px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      touch-action: manipulation;
    }
    .choice-btn:active { transform: scale(0.95); }
    .choice-btn.wrong { background-color: #cccccc; color: #777777; box-shadow: none; }
    .choice-btn.correct { background-color: #D55E00; } /* 正解で朱色に光る */

    .next-area { height: 60px; display: flex; align-items: center; justify-content: center; }

    /* ボタン共通 */
    button.action-btn {
      font-size: 1.3rem; padding: 15px 40px; border: none; border-radius: 30px;
      font-weight: bold; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      width: 85%; max-width: 320px; margin-bottom: 10px;
    }
    .btn-start { background-color: #009E73; color: white; font-size: 1.5rem; }
    .btn-next { background-color: #E69F00; color: #222222; display: none; }
    .btn-retry { background-color: #CC79A7; color: white; } /* CUDの赤紫（チャレンジ用） */

    /* アニメーション演出 */
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .anime-active { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    .result-title { font-size: 2rem; color: #222222; margin-bottom: 15px; font-weight: bold; }
    .result-time { font-size: 2.5rem; color: #D55E00; font-weight: bold; margin-bottom: 20px; }
    .result-message { font-size: 1.3rem; margin-bottom: 20px; font-weight: bold; color: #0072B2; }
    
    .new-record { 
      color: #222222; background: #F0E442; padding: 5px 20px; border-radius: 20px; 
      font-size: 1.2rem; margin-bottom: 15px; display: none; font-weight: bold;
      border: 2px solid #222222; animation: pulse 1s infinite;
    }
  </style>
</head>
<body>

  <!-- 画面1：スタート画面 -->
  <div id="start-screen" class="screen active">
    <h1>けいさんカード</h1>
    
    <div class="mode-selector">
      <select id="mode" onchange="updateRecordsDisplay()">
        <option value="add">けいさんカード1</option>
        <option value="sub">けいさんカード2</option>
      </select>
    </div>

    <div class="record-box">
      <div class="best-time">👑 ベストタイム: <span id="best-time-display">--:--</span></div>
      <div class="last-time">🕒 ぜんかい: <span id="last-time-display">--:--</span></div>
    </div>

    <button class="action-btn btn-start" onclick="startGame()">よーい、スタート！</button>
  </div>

  <!-- 画面2：プレイ画面 -->
  <div id="play-screen" class="screen">
    <div class="top-bar">
      <!-- カワイイおうちマークのボタン -->
      <button class="back-btn" onclick="goToStart()">🏠</button>
      <div class="progress"><span id="current-q">1</span> / <span id="total-q">81</span></div>
    </div>

    <div class="flashcard">
      <div class="card-ring"></div>
      <div class="card-hole"></div>
      <div class="question" id="question">1 + 1</div>
      <div class="maru-mark" id="maru-mark">⭕️</div>
    </div>

    <!-- 10個の選択肢 -->
    <div class="choices-container" id="choices-container"></div>

    <div class="next-area">
      <button id="next-btn" class="action-btn btn-next" onclick="goToNextQuestion()">つぎへ ＞</button>
    </div>
  </div>

  <!-- 画面3：結果発表画面 -->
  <div id="result-screen" class="screen">
    <div id="result-content">
      <div class="result-title" id="result-title">🎉 がんばったね！ 🎉</div>
      <div id="new-record-badge" class="new-record">✨ 新記録達成！ ✨</div>
      <div class="result-time" id="final-time">00:00</div>
      <div class="result-message" id="result-message"></div>
      
      <button id="retry-btn" class="action-btn btn-retry" onclick="startRetry()" style="display: none;">もう一度まちがえた問題にチャレンジ</button>
      <button class="action-btn btn-start" onclick="goToStart()">🏠 さいしょにもどる</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }

    let allQuestions = [];
    let wrongQuestions = [];
    let currentQuestionNum = 1;
    let startTime;
    let isAnswered = false;
    let isFirstAttempt = true; // 1回目で正解したかのチェック
    let playMode = 'normal'; // 'normal' または 'retry'

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateRecordsDisplay() {
      const mode = document.getElementById('mode').value;
      const best = localStorage.getItem(`bestTime_${mode}`);
      const last = localStorage.getItem(`lastTime_${mode}`);
      document.getElementById('best-time-display').innerText = best ? formatTime(best) : '--:--';
      document.getElementById('last-time-display').innerText = last ? formatTime(last) : '--:--';
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function goToStart() {
      updateRecordsDisplay();
      showScreen('start-screen');
    }

    // すべての81問を作成する
    function generateAllQuestions() {
      allQuestions = [];
      const mode = document.getElementById('mode').value;
      
      if (mode === 'add') {
        // たしざん（1+1 から 9+9 まで 全81問）
        for (let i = 1; i <= 9; i++) {
          for (let j = 1; j <= 9; j++) {
            allQuestions.push({ qStr: `${i} + ${j}`, ans: i + j });
          }
        }
      } else {
        // ひきざん（こたえが1〜9になる 全81問）
        for (let ans = 1; ans <= 9; ans++) {
          for (let sub = 1; sub <= 9; sub++) {
            allQuestions.push({ qStr: `${ans + sub} - ${sub}`, ans: ans });
          }
        }
      }
      // シャッフルする
      allQuestions.sort(() => Math.random() - 0.5);
    }

    function startGame() {
      playMode = 'normal';
      wrongQuestions = [];
      generateAllQuestions();
      startSequence();
    }

    function startRetry() {
      playMode = 'retry';
      // まちがえた問題を今回の問題リストにコピーし、シャッフル
      allQuestions = [...wrongQuestions].sort(() => Math.random() - 0.5);
      wrongQuestions = []; // もう一度まちがえた時用にリセット
      startSequence();
    }

    function startSequence() {
      currentQuestionNum = 1;
      startTime = Date.now();
      document.getElementById('total-q').innerText = allQuestions.length;
      showNextQuestion();
      showScreen('play-screen');
    }

    function showNextQuestion() {
      isAnswered = false;
      isFirstAttempt = true;
      const q = allQuestions[currentQuestionNum - 1];
      
      document.getElementById('question').innerText = q.qStr;
      document.getElementById('current-q').innerText = currentQuestionNum;
      
      document.getElementById('maru-mark').classList.remove('show');
      document.getElementById('next-btn').style.display = 'none';

      createChoiceButtons(q.ans);
    }

    // 10個の選択肢を並べる
    function createChoiceButtons(correctAnswer) {
      const container = document.getElementById('choices-container');
      container.innerHTML = ''; 

      let choices = [];
      // 答えの数字を中心に、連続した10個の数字を作る（例：答えが8なら、4〜13）
      let startNum = correctAnswer - 4;
      if (startNum < 1) startNum = 1;
      if (startNum + 9 > 18) startNum = 9; // 最大の答えが18（9+9）なので調整

      for (let i = 0; i < 10; i++) {
        choices.push(startNum + i);
      }

      // ボタンを10個配置
      choices.forEach(number => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = number;
        btn.onclick = () => handleChoice(btn, number, correctAnswer);
        container.appendChild(btn);
      });
    }

    function handleChoice(btn, selectedNumber, correctAnswer) {
      if (isAnswered) return; 

      if (selectedNumber === correctAnswer) {
        isAnswered = true;
        btn.classList.add('correct');
        document.getElementById('maru-mark').classList.add('show');
        document.getElementById('next-btn').style.display = 'block';
        
        document.querySelectorAll('.choice-btn').forEach(b => {
          if (b !== btn) b.classList.add('wrong');
        });
      } else {
        // 1回目に間違えた時だけ「苦手リスト」に追加
        if (isFirstAttempt) {
          wrongQuestions.push(allQuestions[currentQuestionNum - 1]);
          isFirstAttempt = false;
        }
        btn.classList.add('wrong');
        btn.style.transform = 'translateX(-5px)';
        setTimeout(() => btn.style.transform = 'translateX(5px)', 100);
        setTimeout(() => btn.style.transform = 'translateX(0)', 200);
      }
    }

    function goToNextQuestion() {
      if (currentQuestionNum < allQuestions.length) {
        currentQuestionNum++;
        showNextQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      const endTime = Date.now();
      const timeTaken = endTime - startTime;
      const mode = document.getElementById('mode').value;
      const badge = document.getElementById('new-record-badge');
      const title = document.getElementById('result-title');
      const message = document.getElementById('result-message');
      const retryBtn = document.getElementById('retry-btn');
      
      // アニメーションのリセットと発動
      const content = document.getElementById('result-content');
      content.classList.remove('anime-active');
      void content.offsetWidth; // アニメーションを再起動するおまじない
      content.classList.add('anime-active');

      document.getElementById('final-time').innerText = formatTime(timeTaken);
      badge.style.display = 'none';

      // タイム記録は「最初の81問」を通しでやった時だけ保存する
      if (playMode === 'normal') {
        const best = localStorage.getItem(`bestTime_${mode}`);
        localStorage.setItem(`lastTime_${mode}`, timeTaken);
        
        if (!best || timeTaken < best) {
          localStorage.setItem(`bestTime_${mode}`, timeTaken);
          badge.style.display = 'inline-block'; // 新記録アニメーション！
        }
      }

      // 苦手問題があるかどうかで画面を分ける
      if (wrongQuestions.length > 0) {
        title.innerText = "🎉 がんばったね！ 🎉";
        message.innerText = `あやふやなもんだいが ${wrongQuestions.length}問 あったよ！`;
        retryBtn.style.display = 'inline-block'; // チャレンジボタンを表示
      } else {
        title.innerText = "🎉 がんばったね！えらい！ 🎉";
        message.innerText = "✨ ぜんもんせいかい！パーフェクト！ ✨";
        retryBtn.style.display = 'none'; // チャレンジボタンを隠す
      }

      showScreen('result-screen');
    }

    window.onload = updateRecordsDisplay;
  </script>
</body>
</html>
