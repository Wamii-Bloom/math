<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>けいさんカード</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 全体のデザイン */
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: #f7f7f7;
      color: #222222;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    
    h1 {
      font-size: 1.8rem;
      color: #222222;
      margin-bottom: 15px;
    }

    /* 画面の切り替え */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* メニュー選択 */
    .mode-selector {
      margin-bottom: 20px;
    }
    .mode-selector select {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #555555;
      background-color: white;
      color: #222222;
      outline: none;
      font-weight: bold;
    }

    /* 記録表示 */
    .record-box {
      background: white;
      border-radius: 15px;
      padding: 15px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 20px;
      border: 2px solid #dddddd;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .record-box div { margin: 5px 0; }
    .best-time { color: #D55E00; } 
    .last-time { color: #0072B2; }

    /* 上部バー（戻るボタン・進行度） */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 85%;
      max-width: 320px;
      margin-bottom: 20px; /* カードとの隙間を少し広げました */
    }
    .back-btn {
      background: white;
      border: 2px solid #555555;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
      color: #222222;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .progress {
      font-size: 1.3rem;
      font-weight: bold;
      color: #222222;
      background: white;
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid #dddddd;
    }

    /* 🌟 本物の計算カード風デザイン 🌟 */
    .flashcard {
      position: relative;
      background-color: #ffffff;
      border: 2px solid #cccccc;
      border-radius: 15px;
      width: 85%;
      max-width: 320px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    /* カードの左上の穴 */
    .card-hole {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 25px;
      height: 25px;
      background-color: #f7f7f7;
      border-radius: 50%;
      border: 1px solid #cccccc;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.1);
      z-index: 1;
    }

    /* カードのリング（金具） */
    .card-ring {
      position: absolute;
      top: -15px;
      left: 17px;
      width: 20px;
      height: 45px;
      border: 5px solid #aaaaaa;
      border-radius: 15px;
      z-index: 2;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    /* 問題の文字 */
    .question {
      font-size: 4.5rem;
      font-weight: bold;
      letter-spacing: 5px;
      color: #222222;
      z-index: 3;
    }

    /* 正解したときの大きな「マル」 */
    .maru-mark {
      position: absolute;
      font-size: 10rem;
      color: #D55E00; /* CUDの朱色 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
      z-index: 4;
    }
    .maru-mark.show {
      opacity: 0.6;
    }

    /* 答えを選ぶボタンのエリア */
    .choices-container {
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .choice-btn {
      background-color: #0072B2; /* CUDの青 */
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: all 0.1s ease;
      touch-action: manipulation;
    }
    .choice-btn:active {
      transform: scale(0.95);
    }
    .choice-btn.wrong {
      background-color: #cccccc;
      color: #777777;
      box-shadow: none;
    }
    .choice-btn.correct {
      background-color: #D55E00; /* 正解したら朱色に光る */
    }

    /* 次へ進むエリア（最初は隠しておく） */
    .next-area {
      height: 60px; /* 高さを確保して画面のガタつきを防ぐ */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* スタート・次へ・戻る などの基本ボタン */
    button.action-btn {
      font-size: 1.3rem;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-start { 
      background-color: #009E73; /* CUDの緑 */
      color: white; 
      font-size: 1.5rem; 
      width: 85%; 
      max-width: 320px; 
    }
    .btn-next { 
      background-color: #E69F00; /* CUDのオレンジ */
      color: #222222; 
      display: none; /* 最初は隠す */
    }

    /* 結果画面 */
    .result-title { font-size: 2rem; color: #222222; margin-bottom: 20px; font-weight: bold; }
    .result-time { font-size: 2.5rem; color: #D55E00; font-weight: bold; margin-bottom: 30px; }
    .new-record { 
      color: #222222; 
      background: #F0E442;
      padding: 5px 15px; 
      border-radius: 20px; 
      font-size: 1.2rem; 
      margin-bottom: 15px; 
      display: none; 
      font-weight: bold;
      border: 2px solid #222222;
    }
  </style>
</head>
<body>

  <!-- 画面1：スタート画面 -->
  <div id="start-screen" class="screen active">
    <h1>けいさんカード</h1>
    
    <div class="mode-selector">
      <select id="mode" onchange="updateRecordsDisplay()">
        <option value="add">けいさんカード1</option>
        <option value="sub">けいさんカード2</option>
      </select>
    </div>

    <div class="record-box">
      <div class="best-time">👑 ベストタイム: <span id="best-time-display">--:--</span></div>
      <div class="last-time">🕒 ぜんかい: <span id="last-time-display">--:--</span></div>
    </div>

    <button class="action-btn btn-start" onclick="startGame()">よーい、スタート！</button>
  </div>

  <!-- 画面2：プレイ画面 -->
  <div id="play-screen" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goToStart()">↩️</button>
      <div class="progress"><span id="current-q">1</span> / 10</div>
    </div>

    <!-- 🌟 計算カード本体 -->
    <div class="flashcard">
      <div class="card-ring"></div>
      <div class="card-hole"></div>
      <div class="question" id="question">1 + 1</div>
      <div class="maru-mark" id="maru-mark">⭕️</div>
    </div>

    <!-- 答えを選ぶボタン（3つ） -->
    <div class="choices-container" id="choices-container">
      <!-- JavaScriptでボタンを作ります -->
    </div>

    <!-- 次へボタン -->
    <div class="next-area">
      <button id="next-btn" class="action-btn btn-next" onclick="goToNextQuestion()">つぎへ ＞</button>
    </div>
  </div>

  <!-- 画面3：結果発表画面 -->
  <div id="result-screen" class="screen">
    <div class="result-title">🎉 よくがんばったね！ 🎉</div>
    <div id="new-record-badge" class="new-record">✨ 新記録達成！ ✨</div>
    <div class="result-time" id="final-time">00:00</div>
    <button class="action-btn btn-start" onclick="goToStart()">さいしょにもどる</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }

    const TOTAL_QUESTIONS = 10;
    let currentQuestionNum = 1;
    let currentAnswer = 0;
    let startTime;
    let isAnswered = false; // 答えを選んだかどうかのチェック

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateRecordsDisplay() {
      const mode = document.getElementById('mode').value;
      const best = localStorage.getItem(`bestTime_${mode}`);
      const last = localStorage.getItem(`lastTime_${mode}`);
      
      document.getElementById('best-time-display').innerText = best ? formatTime(best) : '--:--';
      document.getElementById('last-time-display').innerText = last ? formatTime(last) : '--:--';
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function goToStart() {
      updateRecordsDisplay();
      showScreen('start-screen');
    }

    function startGame() {
      currentQuestionNum = 1;
      startTime = Date.now();
      generateQuestion();
      showScreen('play-screen');
    }

    function generateQuestion() {
      isAnswered = false;
      const mode = document.getElementById('mode').value;
      let num1, num2;

      // 問題の作成
      if (mode === 'add') {
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        currentAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2}`;
      } else {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * num1) + 1;
        currentAnswer = num1 - num2;
        document.getElementById('question').innerText = `${num1} - ${num2}`;
      }

      document.getElementById('current-q').innerText = currentQuestionNum;
      
      // まるマークと次へボタンを隠す
      document.getElementById('maru-mark').classList.remove('show');
      document.getElementById('next-btn').style.display = 'none';

      // 3つの選択肢を作る
      createChoiceButtons();
    }

    function createChoiceButtons() {
      const container = document.getElementById('choices-container');
      container.innerHTML = ''; // ボタンを一度リセット

      // 正解と、ダミーの数字を2つ用意する
      let choices = [currentAnswer];
      while (choices.length < 3) {
        // 正解に近い数字（±1〜3）をランダムに作る
        let offset = Math.floor(Math.random() * 3) + 1;
        let isPlus = Math.random() < 0.5;
        let dummy = isPlus ? currentAnswer + offset : currentAnswer - offset;
        
        // マイナスの答えにならないようにしつつ、同じ数字が被らないようにする
        if (dummy >= 0 && !choices.includes(dummy)) {
          choices.push(dummy);
        }
      }

      // 選択肢の順番をシャッフルする
      choices.sort(() => Math.random() - 0.5);

      // ボタンを画面に追加する
      choices.forEach(number => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = number;
        btn.onclick = () => handleChoice(btn, number);
        container.appendChild(btn);
      });
    }

    // 選択肢が押された時の動き
    function handleChoice(btn, selectedNumber) {
      if (isAnswered) return; // すでに正解している場合は押せないようにする

      if (selectedNumber === currentAnswer) {
        // 🎉 大正解のとき！
        isAnswered = true;
        btn.classList.add('correct');
        document.getElementById('maru-mark').classList.add('show');
        document.getElementById('next-btn').style.display = 'block'; // つぎへボタンを出す
        
        // 正解以外のボタンを少し薄くする
        document.querySelectorAll('.choice-btn').forEach(b => {
          if (b !== btn) b.classList.add('wrong');
        });
      } else {
        // ざんねん！ちがうとき（ボタンをグレーにしてもう一度考えられるようにする）
        btn.classList.add('wrong');
        // 少し揺れるアニメーション（オプション）
        btn.style.transform = 'translateX(-5px)';
        setTimeout(() => btn.style.transform = 'translateX(5px)', 100);
        setTimeout(() => btn.style.transform = 'translateX(0)', 200);
      }
    }

    function goToNextQuestion() {
      if (currentQuestionNum < TOTAL_QUESTIONS) {
        currentQuestionNum++;
        generateQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      const endTime = Date.now();
      const timeTaken = endTime - startTime;
      const mode = document.getElementById('mode').value;
      
      document.getElementById('final-time').innerText = formatTime(timeTaken);
      
      const best = localStorage.getItem(`bestTime_${mode}`);
      const badge = document.getElementById('new-record-badge');
      
      localStorage.setItem(`lastTime_${mode}`, timeTaken);
      
      if (!best || timeTaken < best) {
        localStorage.setItem(`bestTime_${mode}`, timeTaken);
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      showScreen('result-screen');
    }

    window.onload = updateRecordsDisplay;
  </script>
</body>
</html>
