<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloom Wammy けいさんカード</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff9e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 全体のやさしいデザイン */
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: #fff9e6;
      color: #5d4037;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    
    h1 {
      font-size: 1.5rem;
      color: #8d6e63;
      margin-bottom: 15px;
    }

    /* モード選択（たしざん・ひきざん） */
    .mode-selector {
      margin-bottom: 20px;
    }
    .mode-selector select {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #a1887f;
      background-color: white;
      color: #5d4037;
      outline: none;
    }

    /* カード全体 */
    .card-container {
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(141, 110, 99, 0.15);
      width: 85%;
      max-width: 320px;
      overflow: hidden;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
    }

    /* もんだいエリア（上部） */
    .question-box {
      background-color: #ffffff;
      padding: 35px 20px 20px 20px;
      border-bottom: 2px dashed #f0e6d2; /* 境界線のやさしい破線 */
    }

    .question {
      font-size: 4.5rem;
      font-weight: bold;
      letter-spacing: 5px;
    }

    /* こたえエリア（下部：ほんのり温かみのある背景色） */
    .answer-box {
      background-color: #fff5e6;
      padding: 20px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .answer {
      font-size: 4rem;
      color: #ff7043;
      font-weight: bold;
      visibility: hidden; /* 最初は答えを隠す */
    }
    .answer.show {
      visibility: visible; /* ボタンを押したら表示 */
    }

    /* ボタンエリア */
    .button-group {
      display: flex;
      justify-content: center;
    }

    button {
      font-size: 1.3rem;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      touch-action: manipulation;
      transition: all 0.2s ease;
    }

    /* こたえをみるボタン（オレンジ） */
    .btn-answer {
      background-color: #ffb74d;
      color: white;
    }

    /* つぎへボタン（グリーン） */
    .btn-next {
      background-color: #81c784;
      color: white;
    }
  </style>
</head>
<body>

  <h1>🌱 Bloom Wammy けいさんカード</h1>

  <div class="mode-selector">
    <select id="mode">
      <option value="add">たしざん</option>
      <option value="sub">ひきざん</option>
    </select>
  </div>

  <div class="card-container">
    <div class="question-box">
      <div class="question" id="question">1 + 1</div>
    </div>
    <div class="answer-box">
      <div class="answer" id="answer">2</div>
    </div>
  </div>

  <div class="button-group">
    <button id="actionBtn" class="btn-answer" onclick="handleButtonClick()">こたえをみる</button>
  </div>

  <script>
    // サービスワーカーの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker 登録完了:', reg))
          .catch(err => console.log('Service Worker 登録失敗:', err));
      });
    }

    let currentAnswer = 0;
    let isAnswerShown = false; // 答えが表示されているかの状態

    // 問題を作る機能
    function generateQuestion() {
      const mode = document.getElementById('mode').value;
      let num1, num2;

      if (mode === 'add') {
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        currentAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2}`;
      } else {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * num1) + 1;
        currentAnswer = num1 - num2;
        document.getElementById('question').innerText = `${num1} - ${num2}`;
      }

      // 答えを隠す
      const answerElement = document.getElementById('answer');
      answerElement.innerText = currentAnswer;
      answerElement.classList.remove('show');

      // ボタンを「こたえをみる」に戻す
      const btn = document.getElementById('actionBtn');
      btn.innerText = 'こたえをみる';
      btn.className = 'btn-answer';
      isAnswerShown = false;
    }

    // ボタンが押されたときの処理（1つのボタンで役割を交互に切り替え）
    function handleButtonClick() {
      const answerElement = document.getElementById('answer');
      const btn = document.getElementById('actionBtn');

      if (!isAnswerShown) {
        // 答えを表示し、ボタンを「つぎへ ＞」に切り替える
        answerElement.classList.add('show');
        btn.innerText = 'つぎへ ＞';
        btn.className = 'btn-next';
        isAnswerShown = true;
      } else {
        // 次の問題に進む
        generateQuestion();
      }
    }

    // モード切り替え時
    document.getElementById('mode').addEventListener('change', generateQuestion);

    // 初期表示
    window.onload = generateQuestion;
  </script>
</body>
</html>
