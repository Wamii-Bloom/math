<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>けいさんカード</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 全体のデザイン（明暗をはっきりさせる） */
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: #f7f7f7; /* 明るいグレー寄りの白 */
      color: #222222; /* ほぼ黒でくっきり見せる */
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    
    h1 {
      font-size: 1.8rem;
      color: #222222;
      margin-bottom: 15px;
    }

    /* 各画面の切り替え用 */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .screen.active {
      display: flex;
    }

    /* モード選択（けいさんカード1・2） */
    .mode-selector {
      margin-bottom: 20px;
    }
    .mode-selector select {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #555555;
      background-color: white;
      color: #222222;
      outline: none;
      font-weight: bold;
    }

    /* 記録表示エリア */
    .record-box {
      background: white;
      border-radius: 15px;
      padding: 15px;
      width: 80%;
      max-width: 300px;
      margin-bottom: 20px;
      border: 2px solid #dddddd;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .record-box div {
      margin: 5px 0;
    }
    /* 色弱の方でも見やすい朱色と青 */
    .best-time { color: #D55E00; } 
    .last-time { color: #0072B2; }

    /* プレイ画面の上のバー */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 85%;
      max-width: 320px;
      margin-bottom: 10px;
    }
    .back-btn {
      background: white;
      border: 2px solid #555555;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
      color: #222222;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .progress {
      font-size: 1.3rem;
      font-weight: bold;
      color: #222222;
      background: white;
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid #dddddd;
    }

    /* カード全体 */
    .card-container {
      background: white;
      border-radius: 25px;
      border: 2px solid #cccccc;
      width: 85%;
      max-width: 320px;
      overflow: hidden;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
    }

    .question-box {
      background-color: #ffffff;
      padding: 35px 20px 20px 20px;
      border-bottom: 3px solid #eeeeee; /* 破線から見やすい実線に変更 */
    }
    .question {
      font-size: 4.5rem;
      font-weight: bold;
      letter-spacing: 5px;
    }

    .answer-box {
      background-color: #fdfdfd;
      padding: 20px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .answer {
      font-size: 4rem;
      color: #D55E00; /* 見やすい朱色 */
      font-weight: bold;
      visibility: hidden;
    }
    .answer.show {
      visibility: visible;
    }

    /* ボタンエリア（カラーユニバーサルデザイン） */
    button {
      font-size: 1.3rem;
      padding: 15px 40px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s ease;
    }
    
    /* スタート：青みのある緑（白文字） */
    .btn-start { 
      background-color: #009E73; 
      color: white; 
      font-size: 1.5rem; 
      width: 85%; 
      max-width: 320px; 
    }
    
    /* こたえをみる：オレンジ（黒文字でコントラスト確保） */
    .btn-answer { 
      background-color: #E69F00; 
      color: #222222; 
    }
    
    /* つぎへ：濃い青（白文字） */
    .btn-next { 
      background-color: #0072B2; 
      color: white; 
    }
    
    /* 結果画面 */
    .result-title { font-size: 2rem; color: #222222; margin-bottom: 20px; font-weight: bold; }
    .result-time { font-size: 2.5rem; color: #D55E00; font-weight: bold; margin-bottom: 30px; }
    .new-record { 
      color: #222222; 
      background: #F0E442; /* 見やすい黄色 */
      padding: 5px 15px; 
      border-radius: 20px; 
      font-size: 1.2rem; 
      margin-bottom: 15px; 
      display: none; 
      font-weight: bold;
      border: 2px solid #222222;
    }
  </style>
</head>
<body>

  <!-- 画面1：スタート画面 -->
  <div id="start-screen" class="screen active">
    <h1>けいさんカード</h1>
    
    <div class="mode-selector">
      <select id="mode" onchange="updateRecordsDisplay()">
        <option value="add">けいさんカード1</option>
        <option value="sub">けいさんカード2</option>
      </select>
    </div>

    <div class="record-box">
      <div class="best-time">👑 ベストタイム: <span id="best-time-display">--:--</span></div>
      <div class="last-time">🕒 ぜんかい: <span id="last-time-display">--:--</span></div>
    </div>

    <button class="btn-start" onclick="startGame()">よーい、スタート！</button>
  </div>

  <!-- 画面2：プレイ画面 -->
  <div id="play-screen" class="screen">
    <div class="top-bar">
      <button class="back-btn" onclick="goToStart()">↩️</button>
      <div class="progress"><span id="current-q">1</span> / 10</div>
    </div>

    <div class="card-container">
      <div class="question-box">
        <div class="question" id="question">1 + 1</div>
      </div>
      <div class="answer-box">
        <div class="answer" id="answer">2</div>
      </div>
    </div>

    <button id="actionBtn" class="btn-answer" onclick="handleButtonClick()">こたえをみる</button>
  </div>

  <!-- 画面3：結果発表画面 -->
  <div id="result-screen" class="screen">
    <div class="result-title">🎉 よくがんばったね！ 🎉</div>
    <div id="new-record-badge" class="new-record">✨ 新記録達成！ ✨</div>
    <div class="result-time" id="final-time">00:00</div>
    <button class="btn-start" onclick="goToStart()">さいしょにもどる</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }

    const TOTAL_QUESTIONS = 10;
    let currentQuestionNum = 1;
    let currentAnswer = 0;
    let isAnswerShown = false;
    let startTime;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function updateRecordsDisplay() {
      const mode = document.getElementById('mode').value;
      const best = localStorage.getItem(`bestTime_${mode}`);
      const last = localStorage.getItem(`lastTime_${mode}`);
      
      document.getElementById('best-time-display').innerText = best ? formatTime(best) : '--:--';
      document.getElementById('last-time-display').innerText = last ? formatTime(last) : '--:--';
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function goToStart() {
      updateRecordsDisplay();
      showScreen('start-screen');
    }

    function startGame() {
      currentQuestionNum = 1;
      startTime = Date.now();
      generateQuestion();
      showScreen('play-screen');
    }

    function generateQuestion() {
      const mode = document.getElementById('mode').value;
      let num1, num2;

      if (mode === 'add') {
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        currentAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2}`;
      } else {
        num1 = Math.floor(Math.random() * 10) + 1;
        num2 = Math.floor(Math.random() * num1) + 1;
        currentAnswer = num1 - num2;
        document.getElementById('question').innerText = `${num1} - ${num2}`;
      }

      document.getElementById('current-q').innerText = currentQuestionNum;
      
      const answerElement = document.getElementById('answer');
      answerElement.innerText = currentAnswer;
      answerElement.classList.remove('show');

      const btn = document.getElementById('actionBtn');
      btn.innerText = 'こたえをみる';
      btn.className = 'btn-answer';
      isAnswerShown = false;
    }

    function handleButtonClick() {
      const answerElement = document.getElementById('answer');
      const btn = document.getElementById('actionBtn');

      if (!isAnswerShown) {
        answerElement.classList.add('show');
        btn.innerText = 'つぎへ ＞';
        btn.className = 'btn-next';
        isAnswerShown = true;
      } else {
        if (currentQuestionNum < TOTAL_QUESTIONS) {
          currentQuestionNum++;
          generateQuestion();
        } else {
          finishGame();
        }
      }
    }

    function finishGame() {
      const endTime = Date.now();
      const timeTaken = endTime - startTime;
      const mode = document.getElementById('mode').value;
      
      document.getElementById('final-time').innerText = formatTime(timeTaken);
      
      const best = localStorage.getItem(`bestTime_${mode}`);
      const badge = document.getElementById('new-record-badge');
      
      localStorage.setItem(`lastTime_${mode}`, timeTaken);
      
      if (!best || timeTaken < best) {
        localStorage.setItem(`bestTime_${mode}`, timeTaken);
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      showScreen('result-screen');
    }

    window.onload = updateRecordsDisplay;
  </script>
</body>
</html>
