<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで見やすくするための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bloom Wammy けいさんカード</title>
  
  <!-- PWA化のための設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fff9e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    /* 全体のやさしいデザイン */
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
      background-color: #fff9e6;
      color: #5d4037;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }
    
    h1 {
      font-size: 1.5rem;
      color: #8d6e63;
      margin-bottom: 15px;
    }

    /* モード選択（たしざん・ひきざん） */
    .mode-selector {
      margin-bottom: 20px;
    }
    .mode-selector select {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #a1887f;
      background-color: white;
      color: #5d4037;
      outline: none;
    }

    /* カードのデザイン */
    .card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(141, 110, 99, 0.15);
      width: 85%;
      max-width: 320px;
      padding: 50px 20px;
      margin-bottom: 30px;
    }

    .question {
      font-size: 4.5rem;
      font-weight: bold;
      letter-spacing: 5px;
    }

    .answer {
      font-size: 4rem;
      color: #ff7043;
      font-weight: bold;
      margin-top: 20px;
      height: 70px;
      visibility: hidden; /* 最初は答えを隠す */
    }
    .answer.show {
      visibility: visible; /* ボタンを押したら表示 */
    }

    /* ボタンのデザイン */
    .button-group {
      display: flex;
      gap: 15px;
    }

    button {
      font-size: 1.2rem;
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      touch-action: manipulation;
    }

    .btn-answer {
      background-color: #ffb74d;
      color: white;
    }

    .btn-next {
      background-color: #81c784;
      color: white;
    }
  </style>
</head>
<body>

  <h1>🌱 Bloom Wammy けいさんカード</h1>

  <div class="mode-selector">
    <select id="mode">
      <option value="add">たしざん</option>
      <option value="sub">ひきざん</option>
    </select>
  </div>

  <div class="card">
    <div class="question" id="question">1 + 1</div>
    <div class="answer" id="answer">2</div>
  </div>

  <div class="button-group">
    <button class="btn-answer" onclick="showAnswer()">こたえをみる</button>
    <button class="btn-next" onclick="generateQuestion()">つぎへ ＞</button>
  </div>

  <script>
    // サービスワーカーの登録（PWA化に必須）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker 登録完了:', reg))
          .catch(err => console.log('Service Worker 登録失敗:', err));
      });
    }

    let currentAnswer = 0;

    // 問題を作る機能
    function generateQuestion() {
      const mode = document.getElementById('mode').value;
      let num1, num2;

      if (mode === 'add') {
        // たしざん（1〜9）
        num1 = Math.floor(Math.random() * 9) + 1;
        num2 = Math.floor(Math.random() * 9) + 1;
        currentAnswer = num1 + num2;
        document.getElementById('question').innerText = `${num1} + ${num2}`;
      } else {
        // ひきざん（答えがマイナスにならないようにする）
        num1 = Math.floor(Math.random() * 10) + 1; // 1〜10
        num2 = Math.floor(Math.random() * num1) + 1; // num1以下の数
        currentAnswer = num1 - num2;
        document.getElementById('question').innerText = `${num1} - ${num2}`;
      }

      // 答えを隠す
      const answerElement = document.getElementById('answer');
      answerElement.innerText = currentAnswer;
      answerElement.classList.remove('show');
    }

    // 答えを表示する機能
    function showAnswer() {
      document.getElementById('answer').classList.add('show');
    }

    // モード（たしざん/ひきざん）を変えたら新しい問題にする
    document.getElementById('mode').addEventListener('change', generateQuestion);

    // 最初にページを開いたときの問題を表示
    window.onload = generateQuestion;
  </script>
</body>
</html>
